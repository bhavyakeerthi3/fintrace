<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">FinTrace system architecture</title>
  <desc id="desc">An eight-stage evidence chain separating LLM calls, deterministic Python, filing evidence, validation gates, analyst review, and human sign-off.</desc>
  <defs>
    <style>
      text{font-family:Arial,sans-serif;fill:#172426}.title{font-size:54px;font-weight:700}.subtitle{font-size:22px;fill:#5e696a}.stage{font-size:21px;font-weight:700}.tag{font-size:14px;font-weight:700;letter-spacing:1.2px}.body{font-size:16px;fill:#435052}.small{font-size:14px;fill:#5e696a}.micro{font-size:13px;font-weight:700}.line{fill:none;stroke:#ad3538;stroke-width:4;marker-end:url(#arrow)}.lineThin{fill:none;stroke:#667477;stroke-width:2.5;marker-end:url(#arrowSmall)}.code{fill:#fff3ce;stroke:#d97706;stroke-width:2}.llm{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.human{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.io{fill:#f1f5f9;stroke:#475569;stroke-width:2}.fail{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.group{fill:#fffdf8;stroke:#d9d5cb;stroke-width:2}.edgeLabel{fill:#f4f0e8;stroke:#ded8cd;stroke-width:1}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad3538"/></marker>
    <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#667477"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#322d24" flood-opacity=".08"/></filter>
  </defs>

  <rect width="2400" height="1500" fill="#f4f0e8"/>
  <text x="60" y="78" class="title">FinTrace ML Workflow</text>
  <text x="60" y="118" class="subtitle">Models propose interpretations. Deterministic code calculates and validates. A human makes the final decision.</text>

  <g transform="translate(1570 48)">
    <rect width="210" height="52" rx="26" class="llm"/><text x="105" y="33" text-anchor="middle" class="tag" fill="#1d4ed8">LLM CALL</text>
    <rect x="225" width="250" height="52" rx="26" class="code"/><text x="350" y="33" text-anchor="middle" class="tag" fill="#b45309">DETERMINISTIC</text>
    <rect x="490" width="210" height="52" rx="26" class="human"/><text x="595" y="33" text-anchor="middle" class="tag" fill="#15803d">HUMAN</text>
  </g>
  <text x="2340" y="145" text-anchor="end" class="small">Controlled benchmark: 12 cases / 13 findings</text>

  <!-- First band -->
  <g filter="url(#shadow)">
    <rect x="60" y="245" width="280" height="220" rx="14" class="io"/>
    <text x="200" y="286" text-anchor="middle" class="tag">INPUT</text>
    <text x="200" y="326" text-anchor="middle" class="body"><tspan x="200">Earnings-call transcript</tspan><tspan x="200" dy="27">+ filed financial data</tspan></text>
    <text x="200" y="407" text-anchor="middle" class="small"><tspan x="200">Claims, speakers, periods,</tspan><tspan x="200" dy="24">metrics, and filing corpus</tspan></text>

    <rect x="390" y="245" width="330" height="220" rx="14" class="code"/>
    <text x="420" y="284" class="stage">1. INGEST &amp; ALIGN</text>
    <text x="420" y="315" class="tag" fill="#b45309">DETERMINISTIC PYTHON</text>
    <text x="420" y="351" class="body"><tspan x="420">Adapter: ingest_and_align</tspan><tspan x="420" dy="27">Normalizes claim identity,</tspan><tspan x="420" dy="27">speaker, period, metric, and</tspan><tspan x="420" dy="27">filing references.</tspan></text>

    <rect x="770" y="185" width="1030" height="340" rx="18" class="group"/>
    <text x="805" y="222" class="stage">2. SPECIALIST CALLS</text>
    <text x="1765" y="222" text-anchor="end" class="tag" fill="#1d4ed8">4 SCOPE-ISOLATED LLM CALLS</text>
    <rect x="965" y="242" width="640" height="50" rx="8" class="io"/>
    <text x="1285" y="273" text-anchor="middle" class="body">All 12 benchmark cases batched once per analytical scope</text>

    <rect x="800" y="326" width="225" height="112" rx="10" class="llm"/>
    <text x="912" y="354" text-anchor="middle" class="micro">REVENUE</text>
    <text x="912" y="380" text-anchor="middle" class="small"><tspan x="912">revenue_v1</tspan><tspan x="912" dy="22">LiveLLMProvider</tspan><tspan x="912" dy="22">llama-3.3-70b, T=0</tspan></text>

    <rect x="1050" y="326" width="225" height="112" rx="10" class="llm"/>
    <text x="1162" y="354" text-anchor="middle" class="micro">CASH FLOW</text>
    <text x="1162" y="380" text-anchor="middle" class="small"><tspan x="1162">cash_flow_v1</tspan><tspan x="1162" dy="22">LiveLLMProvider</tspan><tspan x="1162" dy="22">llama-3.3-70b, T=0</tspan></text>

    <rect x="1300" y="326" width="225" height="112" rx="10" class="llm"/>
    <text x="1412" y="354" text-anchor="middle" class="micro">RELATED PARTY</text>
    <text x="1412" y="380" text-anchor="middle" class="small"><tspan x="1412">related_party_v1</tspan><tspan x="1412" dy="22">LiveLLMProvider</tspan><tspan x="1412" dy="22">llama-3.3-70b, T=0</tspan></text>

    <rect x="1550" y="326" width="225" height="112" rx="10" class="llm"/>
    <text x="1662" y="354" text-anchor="middle" class="micro">LANGUAGE</text>
    <text x="1662" y="380" text-anchor="middle" class="small"><tspan x="1662">language_v1</tspan><tspan x="1662" dy="22">LiveLLMProvider</tspan><tspan x="1662" dy="22">llama-3.3-70b, T=0</tspan></text>

    <rect x="1035" y="468" width="500" height="42" rx="7" class="io"/>
    <text x="1285" y="494" text-anchor="middle" class="small">Schema-validated candidates + scope provenance</text>

    <rect x="1850" y="245" width="490" height="220" rx="14" class="code"/>
    <text x="1880" y="284" class="stage">3. AGGREGATE &amp; DEDUPE</text>
    <text x="1880" y="315" class="tag" fill="#b45309">DETERMINISTIC - NOT AN LLM CALL</text>
    <text x="1880" y="351" class="body"><tspan x="1880">aggregate_findings / deterministic-deduplicator</tspan><tspan x="1880" dy="27">Groups by claim identity, preserves every</tspan><tspan x="1880" dy="27">specialist source, and assigns stable IDs.</tspan></text>
  </g>

  <path d="M340 355H390" class="line"/>
  <path d="M720 355H770" class="line"/>
  <path d="M1800 355H1850" class="line"/>
  <path d="M1285 292V310H912V326" class="lineThin"/>
  <path d="M1285 292V310H1162V326" class="lineThin"/>
  <path d="M1285 292V310H1412V326" class="lineThin"/>
  <path d="M1285 292V310H1662V326" class="lineThin"/>
  <path d="M912 438V453H1285V468" class="lineThin"/>
  <path d="M1162 438V453H1285V468" class="lineThin"/>
  <path d="M1412 438V453H1285V468" class="lineThin"/>
  <path d="M1662 438V453H1285V468" class="lineThin"/>

  <g>
    <rect x="340" y="327" width="150" height="36" rx="6" class="edgeLabel"/><text x="415" y="350" text-anchor="middle" class="small">raw content</text>
    <rect x="689" y="327" width="145" height="36" rx="6" class="edgeLabel"/><text x="761" y="350" text-anchor="middle" class="small">aligned data</text>
    <rect x="1770" y="327" width="120" height="36" rx="6" class="edgeLabel"/><text x="1830" y="350" text-anchor="middle" class="small">candidates</text>
  </g>

  <!-- Explicit continuous connector to second band -->
  <path d="M2095 465V600H240V675" class="line"/>
  <rect x="1025" y="575" width="350" height="42" rx="7" class="edgeLabel"/>
  <text x="1200" y="602" text-anchor="middle" class="small">deduplicated findings + provenance</text>

  <!-- Second band -->
  <g filter="url(#shadow)">
    <rect x="60" y="675" width="360" height="270" rx="14" class="code"/>
    <text x="90" y="716" class="stage">4. CODE CALCULATION</text>
    <text x="90" y="747" class="tag" fill="#b45309">AUTHORITATIVE PYTHON</text>
    <text x="90" y="783" class="body"><tspan x="90">reconcile_claims + attach_calculations v1.0</tspan><tspan x="90" dy="28">Computes the value, claimed gap,</tspan><tspan x="90" dy="28">tolerance result, formula, inputs,</tspan><tspan x="90" dy="28">and filing references.</tspan></text>

    <rect x="500" y="675" width="360" height="270" rx="14" class="code"/>
    <text x="530" y="716" class="stage">5. FILING RETRIEVAL</text>
    <text x="530" y="747" class="tag" fill="#b45309">DETERMINISTIC PYTHON</text>
    <text x="530" y="783" class="body"><tspan x="530">retrieve_filing_evidence v1.0</tspan><tspan x="530" dy="28">Ranks filing passages, footnotes,</tspan><tspan x="530" dy="28">MD&amp;A, and claim-linked disclosures.</tspan><tspan x="530" dy="28">Keeps the full filing available.</tspan></text>

    <rect x="940" y="635" width="920" height="390" rx="18" class="group"/>
    <text x="975" y="678" class="stage">6. SECOND-PASS VALIDATION</text>
    <text x="1825" y="678" text-anchor="end" class="tag" fill="#ad3538">FAIL-CLOSED EVIDENCE GATE</text>

    <rect x="985" y="716" width="350" height="170" rx="12" class="llm"/>
    <text x="1015" y="751" class="stage">Second-pass reviewer</text>
    <text x="1015" y="780" class="tag" fill="#1d4ed8">LLM CALL #5 - second_pass_v1</text>
    <text x="1015" y="816" class="body"><tspan x="1015">Receives findings, Python values,</tspan><tspan x="1015" dy="27">candidate passages, and full filing.</tspan><tspan x="1015" dy="27">Proposes EXPLAINED or UNRESOLVED.</tspan></text>

    <rect x="1430" y="716" width="385" height="170" rx="12" class="code"/>
    <text x="1460" y="751" class="stage">Quote + relevance gate</text>
    <text x="1460" y="780" class="tag" fill="#b45309">validate_explanation_quotes</text>
    <text x="1460" y="816" class="body"><tspan x="1460">Exact quote present? Directly related?</tspan><tspan x="1460" dy="27">Does quantified evidence reconcile</tspan><tspan x="1460" dy="27">the actual numerical gap?</tspan></text>

    <rect x="1090" y="930" width="270" height="66" rx="10" class="io"/>
    <text x="1225" y="958" text-anchor="middle" class="micro">ALL GATES PASS</text>
    <text x="1225" y="982" text-anchor="middle" class="tag" fill="#15803d">EXPLAINED</text>

    <rect x="1450" y="930" width="270" height="66" rx="10" class="fail"/>
    <text x="1585" y="958" text-anchor="middle" class="micro">ANY GATE FAILS</text>
    <text x="1585" y="982" text-anchor="middle" class="tag" fill="#b91c1c">UNRESOLVED</text>
  </g>

  <path d="M420 810H500" class="line"/>
  <path d="M860 810H940" class="line"/>
  <path d="M1335 801H1430" class="line"/>
  <path d="M1622 886V910H1225V930" class="lineThin"/>
  <path d="M1622 886V910H1585V930" class="lineThin"/>

  <rect x="405" y="784" width="130" height="42" rx="7" class="edgeLabel"/><text x="470" y="810" text-anchor="middle" class="small">values + gaps</text>
  <rect x="835" y="772" width="170" height="62" rx="7" class="edgeLabel"/><text x="920" y="798" text-anchor="middle" class="small"><tspan x="920">passages +</tspan><tspan x="920" dy="21">full filing</tspan></text>
  <rect x="1320" y="775" width="130" height="52" rx="7" class="edgeLabel"/><text x="1385" y="798" text-anchor="middle" class="small"><tspan x="1385">proposal +</tspan><tspan x="1385" dy="20">quote</tspan></text>

  <!-- Continuous merge into human review -->
  <path d="M1225 996V1090H730V1170" class="line"/>
  <path d="M1585 996V1125H730V1170" class="line"/>
  <rect x="760" y="1068" width="240" height="42" rx="7" class="edgeLabel"/><text x="880" y="1095" text-anchor="middle" class="small">validated evidence package</text>

  <!-- Human band -->
  <g filter="url(#shadow)">
    <rect x="520" y="1170" width="420" height="230" rx="14" class="human"/>
    <text x="550" y="1212" class="stage">7. ANALYST REVIEW</text>
    <text x="550" y="1243" class="tag" fill="#15803d">HUMAN INPUT REQUIRED</text>
    <text x="550" y="1279" class="body"><tspan x="550">Reviews the claim, math, retrieved passages,</tspan><tspan x="550" dy="28">validation result, and neutral risk memo.</tspan><tspan x="550" dy="28">Chooses accept, reject, or needs_review.</tspan></text>

    <rect x="1020" y="1170" width="420" height="230" rx="14" class="human"/>
    <text x="1050" y="1212" class="stage">8. HUMAN SIGN-OFF</text>
    <text x="1050" y="1243" class="tag" fill="#15803d">FINAL JUDGMENT OUTSIDE THE MODEL</text>
    <text x="1050" y="1279" class="body"><tspan x="1050">Named reviewer + note + timestamp.</tspan><tspan x="1050" dy="28">Records the per-finding decision and</tspan><tspan x="1050" dy="28">updates the integrity digest.</tspan></text>

    <rect x="1520" y="1170" width="500" height="230" rx="14" class="io"/>
    <text x="1550" y="1212" class="stage">OUTPUT</text>
    <text x="1550" y="1243" class="tag">VERSIONED EVIDENCE TRAIL</text>
    <text x="1550" y="1279" class="body"><tspan x="1550">JSON report + review state + integrity digest.</tspan><tspan x="1550" dy="28">Explained findings and preserved unresolved</tspan><tspan x="1550" dy="28">findings remain auditable.</tspan></text>
  </g>

  <path d="M940 1285H1020" class="line"/>
  <path d="M1440 1285H1520" class="line"/>
  <rect x="915" y="1259" width="130" height="42" rx="7" class="edgeLabel"/><text x="980" y="1285" text-anchor="middle" class="small">decision</text>
  <rect x="1415" y="1259" width="130" height="42" rx="7" class="edgeLabel"/><text x="1480" y="1285" text-anchor="middle" class="small">signed record</text>

  <text x="60" y="1460" class="subtitle">Rule: EXPLAINED requires specific filing evidence + direct connection + valid quotation + numerical reconciliation. Otherwise, preserve UNRESOLVED.</text>
</svg>
