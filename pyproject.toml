[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fintrace"
version = "0.2.0"
description = "Evidence-first financial claim reconciliation"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber==0.11.10",
    "reportlab==5.0.0",
]

[project.scripts]
fintrace = "fintrace.__main__:main"

[tool.setuptools.packages.find]
include = ["fintrace*"]

[tool.unittest]
start-directory = "tests"
